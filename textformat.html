<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Format</title>
</head>
<body>
    
<!-- bold and Strong-->

<p> <strong> I am Mahir </strong></p>

<p><b>  I am Mahir</b> </p>


<!--italic -->

<p><i>I am Mahir</i></p>


<p><em>I am Mahir</em></p>

<!-- small -->

<p><small>I am Mahir</small></p>


<!--Under LINE -->


<p><u>I am Mahir</u></p>

<p><ins>I am Mahir </ins></p>

<!--Delet -->

<p><del>I am Mahir</del></p>


<!--Heighlight -->

<p><mark>I am Mahir</mark></p>


<!--Power -->

<p>H<sub>2</sub>O</p>

<p>A <sup>2</sup>+B <sup>2</sup></p>


<!-- Quotetion-->

<p>Mahir says,<blockquote>I am Mahir</blockquote></p>


<p>Mahir says,<q>I am Mahir</q></p>


<!-- Adderess-->


<p><address>
Katakhali <br>
Rajshahi <br>
BD

</address></p>


<p>

 Katakhali <br>
